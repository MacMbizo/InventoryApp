name: .NET CI (mini)

on:
  push:
    branches:
      - main
      - ci/*
      - feature/*
      - hotfix/*
      - release/*
  pull_request:
    branches:
      - main
      - release/*
  workflow_dispatch: {}

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Echo context
        run: |
          echo "event=${{ github.event_name }} ref=${{ github.ref }} sha=${{ github.sha }} workflow=${{ github.workflow }} run_id=${{ github.run_id }} on $(date)"