name: .NET CI (mini)

on:
  push:
    branches:
      - main
      - ci/*
      - feature/*
      - hotfix/*
      - release/*
  pull_request:
    branches:
      - main
      - release/*
  workflow_dispatch: {}

jobs:
  secrets-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Echo secrets/vars presence (no values)
        run: |
          echo "MSIX_PFX_B64 set: ${{ secrets.MSIX_PFX_B64 != '' }}"
          echo "MSIX_PFX_PASSWORD set: ${{ secrets.MSIX_PFX_PASSWORD != '' }}"
          echo "WINGET_TOKEN set: ${{ secrets.WINGET_TOKEN != '' }}"
          echo "WINGET_IDENTIFIER var set: ${{ vars.WINGET_IDENTIFIER != '' }}"
  sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Echo context
        run: |
          echo "event=${{ github.event_name }} ref=${{ github.ref }} sha=${{ github.sha }} workflow=${{ github.workflow }} run_id=${{ github.run_id }} on $(date)"

  build-test-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET SDK (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: ./global.json
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/*.csproj
            Directory.Packages.props
      - name: Restore
        run: |
          dotnet restore ./InventoryApp.sln -r win-x64
      - name: Build (project-level to avoid MSIX wapproj)
        run: |
          dotnet build src/KitchenInventory.Domain/KitchenInventory.Domain.csproj --configuration Release --no-restore --nologo
          dotnet build src/KitchenInventory.Data/KitchenInventory.Data.csproj --configuration Release --no-restore --nologo
          dotnet build src/KitchenInventory.Desktop/KitchenInventory.Desktop.csproj --configuration Release --no-restore --nologo
          dotnet build src/QAAgentRunner/QAAgentRunner.csproj --configuration Release --no-restore --nologo
          dotnet build tests/KitchenInventory.Desktop.Tests/KitchenInventory.Desktop.Tests.csproj --configuration Release --no-restore --nologo
          dotnet build tests/QAAgentRunner.Tests/QAAgentRunner.Tests.csproj --configuration Release --no-restore --nologo
      - name: Test (project-level)
        run: |
          dotnet test tests/KitchenInventory.Desktop.Tests/KitchenInventory.Desktop.Tests.csproj --configuration Release --no-build --verbosity normal
          dotnet test tests/QAAgentRunner.Tests/QAAgentRunner.Tests.csproj --configuration Release --no-build --verbosity normal
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-release
          path: |
            src/**/bin/Release/**
            tests/**/bin/Release/**
            tests/**/TestResults/**
      - name: Basic OS and .NET info
        shell: pwsh
        run: |
          Write-Host "PSVersion: $($PSVersionTable.PSVersion)"
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber | Format-List
          dotnet --version