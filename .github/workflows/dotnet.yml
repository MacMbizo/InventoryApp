name: .NET CI (mini)

on:
  push:
    branches:
      - main
      - ci/*
      - feature/*
      - hotfix/*
      - release/*
  pull_request:
    branches:
      - main
      - release/*
  workflow_dispatch: {}

jobs:
  secrets-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Echo secrets/vars presence (no values)
        run: |
          echo "MSIX_PFX_B64 set: ${{ secrets.MSIX_PFX_B64 != '' }}"
          echo "MSIX_PFX_PASSWORD set: ${{ secrets.MSIX_PFX_PASSWORD != '' }}"
          echo "WINGET_TOKEN set: ${{ secrets.WINGET_TOKEN != '' }}"
          echo "WINGET_IDENTIFIER var set: ${{ vars.WINGET_IDENTIFIER != '' }}"
  sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Echo context
        run: |
          echo "event=${{ github.event_name }} ref=${{ github.ref }} sha=${{ github.sha }} workflow=${{ github.workflow }} run_id=${{ github.run_id }} on $(date)"

  build-test-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET SDK (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: ./global.json
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/*.csproj
            Directory.Packages.props
      - name: Restore
        run: |
          dotnet restore ./InventoryApp.sln -r win-x64
      - name: Build (project-level to avoid MSIX wapproj)
        run: |
          dotnet build src/KitchenInventory.Domain/KitchenInventory.Domain.csproj --configuration Release --no-restore --nologo
          dotnet build src/KitchenInventory.Data/KitchenInventory.Data.csproj --configuration Release --no-restore --nologo
          dotnet build src/KitchenInventory.Desktop/KitchenInventory.Desktop.csproj --configuration Release --no-restore --nologo
          dotnet build src/QAAgentRunner/QAAgentRunner.csproj --configuration Release --no-restore --nologo
          dotnet build tests/KitchenInventory.Desktop.Tests/KitchenInventory.Desktop.Tests.csproj --configuration Release --no-restore --nologo
          dotnet build tests/QAAgentRunner.Tests/QAAgentRunner.Tests.csproj --configuration Release --no-restore --nologo
      - name: Test (project-level)
        # UI tests are left out here on purpose: they drive a real desktop with synthetic input, a
        # hosted runner cannot promise the window holds focus, and a swallowed keystroke is
        # indistinguishable from a broken feature. They run in their own job below, where they can
        # be non-blocking without hiding a real logic failure here.
        run: |
          dotnet test tests/KitchenInventory.Desktop.Tests/KitchenInventory.Desktop.Tests.csproj --configuration Release --filter "Category!=UI" --verbosity normal --logger "trx;LogFileName=TestResults.trx"
          dotnet test tests/QAAgentRunner.Tests/QAAgentRunner.Tests.csproj --configuration Release --verbosity normal --logger "trx;LogFileName=TestResults.trx"
      - name: Test with coverage gate (80% line floor on logic)
        # Enforces the 80% minimum test-coverage floor from project-documentation/development-rules.md.
        # Coverage is scoped to testable logic: WPF XAML code-behind, EF migrations and generated code
        # are excluded from the denominator (that surface is covered by UI automation). Threshold config
        # lives in tests/KitchenInventory.Desktop.Tests/KitchenInventory.Desktop.Tests.csproj.
        shell: pwsh
        run: |
          dotnet test tests/KitchenInventory.Desktop.Tests/KitchenInventory.Desktop.Tests.csproj `
            --configuration Release `
            --filter "Category!=UI" `
            --nologo `
            /p:CollectCoverage=true `
            /p:CoverletOutputFormat=cobertura `
            /p:CoverletOutput=./.coverage/ci-coverage
      - name: Build installer (MSI)
        # The installer is the thing that actually gets handed over, so it is built here rather
        # than only on whoever's machine last remembered to. The wixproj publishes the app
        # self-contained and harvests that output itself, so this one command is the whole build.
        run: dotnet build src/Installer.Msi/Installer.Msi.wixproj --configuration Release -p:Platform=x64 --nologo
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-release
          path: |
            src/**/bin/Release/**
            src/Installer.Msi/bin/**/*.msi
            tests/**/bin/Release/**
            tests/**/TestResults/**
            tests/KitchenInventory.Desktop.Tests/.coverage/**
      - name: Basic OS and .NET info
        shell: pwsh
        run: |
          Write-Host "PSVersion: $($PSVersionTable.PSVersion)"
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber | Format-List
          dotnet --version

  ui-tests:
    # Separate from build-test-windows, and non-blocking, on purpose. The suite drives a real
    # desktop with synthetic mouse and keyboard input, which a hosted runner makes no promises
    # about; a flaky result here must not be able to fail a build whose logic tests are green.
    # Once it has proven stable on this runner, continue-on-error comes off.
    continue-on-error: true
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET SDK (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: ./global.json
      - name: Build (brings the desktop app the tests drive)
        run: dotnet build tests/KitchenInventory.Desktop.Tests/KitchenInventory.Desktop.Tests.csproj --configuration Release --nologo
      - name: UI tests
        run: dotnet test tests/KitchenInventory.Desktop.Tests/KitchenInventory.Desktop.Tests.csproj --configuration Release --no-build --filter "Category=UI" --logger "trx;LogFileName=UiResults.trx"
      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: tests/KitchenInventory.Desktop.Tests/TestResults/**

  package-msix:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    needs: build-test-windows
    runs-on: windows-latest
    env:
      MSIX_PFX_B64: ${{ secrets.MSIX_PFX_B64 }}
      MSIX_PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET SDK (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: ./global.json
      - name: Build MSIX package (wapproj)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msixDir = Join-Path $pwd 'artifacts\msix\'
          New-Item -ItemType Directory -Force -Path $msixDir | Out-Null
          if ($env:MSIX_PFX_B64) {
            [IO.File]::WriteAllBytes('signing_cert.pfx', [Convert]::FromBase64String($env:MSIX_PFX_B64))
          }
          $msbuildArgs = @(
            '.\src\Installer.Msix\Installer.Msix.wapproj',
            '/t:Restore;Rebuild',
            '/p:Configuration=Release',
            '/p:UapAppxPackageBuildMode=SideloadOnly',
            "/p:AppxPackageDir=$msixDir"
          )
          if (Test-Path 'signing_cert.pfx') {
            $pfxPath = Join-Path $pwd 'signing_cert.pfx'
            $msbuildArgs += "/p:PackageCertificateKeyFile=$pfxPath"
            if ($env:MSIX_PFX_PASSWORD) { $msbuildArgs += "/p:PackageCertificatePassword=$env:MSIX_PFX_PASSWORD" }
          }
          & msbuild @msbuildArgs
      - name: Upload MSIX artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msix-package
          path: |
            artifacts/msix/**
            src/Installer.Msix/AppPackages/**

  winget-publish:
    if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
    needs: package-msix
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      WINGET_IDENTIFIER: ${{ vars.WINGET_IDENTIFIER }}
    steps:
      - name: Placeholder for winget publish (gated by secrets)
        shell: pwsh
        run: |
          if (-not $env:WINGET_TOKEN -or -not $env:WINGET_IDENTIFIER) {
            Write-Host "Winget publish skipped: token or identifier not configured."
            exit 0
          }
          Write-Host "Winget publish would run here using WINGET_IDENTIFIER=$env:WINGET_IDENTIFIER"
          Write-Host "TODO: Integrate wingetcreate-based submission"