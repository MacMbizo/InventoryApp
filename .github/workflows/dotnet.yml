name: .NET CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
  release:
    types: [ released ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_DbgEnableMiniDump: "1"
      DOTNET_DbgMiniDumpType: "2" # 2=Heap dump
      COMPlus_DbgEnableMiniDump: "1"
      COMPlus_DbgMiniDumpType: "2"
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      INVENTORY_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: ./global.json
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/*.csproj
            **/*.fsproj
            **/*.vbproj
            Directory.Packages.props

      - name: Restore
        run: |
          dotnet restore ./InventoryApp.sln -r win-x64

      - name: Build
        run: |
          dotnet build ./InventoryApp.sln --configuration Release --no-restore

      - name: Smoke (DB migrate + basic query)
        run: |
          dotnet run --project ./src/KitchenInventory.Smoke/KitchenInventory.Smoke.csproj --configuration Release --no-build

      - name: Desktop Headless (startup + migrations)
        continue-on-error: true
        env:
          INVENTORY_HEADLESS: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "${{ github.workspace }}\src\KitchenInventory.Desktop\bin\Release\net8.0-windows\KitchenInventory.Desktop.exe"
          if (!(Test-Path $exe)) { throw "Desktop exe not found at $exe" }
          # Basic headless startup
          $proc = Start-Process -FilePath $exe -ArgumentList '--headless' -PassThru -Wait -NoNewWindow
          $code = $proc.ExitCode
          Write-Host "Headless exit code: $code"
          if ($code -ne 0) { throw "Desktop headless run failed with exit code $code" }

          # CLI CSV import (success)
          $sample = Join-Path $env:TEMP 'sample-import.csv'
          @(
            'Id,Name,Quantity,Unit,CategoryName,ExpiryDate'
            '0,Apples,3,pcs,Produce,2026-01-15'
          ) | Out-File -FilePath $sample -Encoding utf8 -Force
          if (!(Test-Path $sample)) { throw "Sample CSV not created at $sample" }
          & $exe --headless --import-csv "$sample"
          $importOk = $LASTEXITCODE
          Write-Host "CLI import (success) exit code: $importOk"
          if ($importOk -ne 0) { throw "CSV import expected success (0) but got $importOk" }

          # CLI CSV import (missing file -> FileOperationError=11)
          $missing = Join-Path $env:TEMP 'missing.csv'
          if (Test-Path $missing) { Remove-Item $missing -Force }
          & $exe --headless --import-csv "$missing"
          $importMissing = $LASTEXITCODE
          Write-Host "CLI import (missing) exit code: $importMissing"
          if ($importMissing -ne 11) { throw "CSV import expected FileOperationError (11) but got $importMissing" }

      - name: Test (all non-UI)
        run: |
          dotnet test ./InventoryApp.sln --configuration Release --no-build --no-restore --logger "trx;LogFileName=test-results.trx" --filter "Category!=UI"

      - name: UI Smoke Tests (xUnit + FlaUI)
        continue-on-error: true
        run: |
          dotnet test ./tests/KitchenInventory.Desktop.Tests/KitchenInventory.Desktop.Tests.csproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=ui-smoke.trx" --filter "Category=UI"

      - name: Publish Desktop (portable)
        shell: pwsh
        run: |
          $dest = "${{ github.workspace }}\artifacts\publish\desktop"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          dotnet publish ./src/KitchenInventory.Desktop/KitchenInventory.Desktop.csproj `
            -c Release -r win-x64 -o $dest `
            -p:PublishSingleFile=false -p:IncludeNativeLibrariesForSelfExtract=false --no-restore

      - name: Package Portable Zip
        shell: pwsh
        run: |
          $src = "${{ github.workspace }}\artifacts\publish\desktop"
          $zip = "${{ github.workspace }}\artifacts\KitchenInventory.Desktop-win-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $src '*') -DestinationPath $zip -Force

      - name: Upload Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KitchenInventory.Desktop-win-x64
          path: artifacts/KitchenInventory.Desktop-win-x64.zip
          retention-days: 7

      - name: Build MSI (WiX v4)
        shell: pwsh
        run: |
          $publishDir = "${{ github.workspace }}\artifacts\publish\desktop"
          if (!(Test-Path $publishDir)) { throw "Publish dir not found: $publishDir" }
          dotnet build .\src\Installer.Msi\Installer.Msi.wixproj -c Release -p:AppPublishDir="$publishDir" --nologo
          $msi = Get-ChildItem -Path .\src\Installer.Msi\bin\Release\*.msi -ErrorAction Stop | Select-Object -First 1
          if (-not $msi) { throw "MSI not found" }
          $outDir = "${{ github.workspace }}\artifacts\installer"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          Copy-Item $msi.FullName (Join-Path $outDir $msi.Name) -Force

      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KitchenInventory-Installer-MSI
          path: artifacts/installer/*.msi
          retention-days: 7

      - name: Build MSIX (Desktop Bridge)
        if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
        shell: pwsh
        env:
          MSIX_PFX_B64: ${{ secrets.MSIX_PFX_B64 }}
          MSIX_PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $msixProject = "${{ github.workspace }}\src\Installer.Msix\Installer.Msix.wapproj"
          $vswhere = "${Env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) { throw "vswhere.exe not found at $vswhere" }
          $msbuildPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe"
          if (-not $msbuildPath) { throw "MSBuild.exe not found via vswhere" }

          $msbuildArgs = "/m /t:Restore,Build /p:Configuration=Release /nologo"
          $pfxPath = $null
          if ($env:MSIX_PFX_B64 -and $env:MSIX_PFX_PASSWORD) {
            Write-Host "Signing enabled: using PFX from secrets."
            $pfxPath = Join-Path $env:RUNNER_TEMP "signing.pfx"
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:MSIX_PFX_B64))
            $msbuildArgs = "$msbuildArgs /p:AppxPackageSigningEnabled=true /p:PackageCertificateKeyFile=\"$pfxPath\" /p:PackageCertificatePassword=\"$env:MSIX_PFX_PASSWORD\""
          }
          else {
            Write-Host "Signing disabled: building unsigned MSIX."
            $msbuildArgs = "$msbuildArgs /p:AppxPackageSigningEnabled=false"
          }

          & $msbuildPath $msixProject $msbuildArgs
          if ($LASTEXITCODE -ne 0) { throw "MSIX build failed" }
          $outDir = "${{ github.workspace }}\\artifacts\\installer"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $msix = Get-ChildItem -Recurse -Path "${{ github.workspace }}\src\Installer.Msix\bin\Release" -Include *.msix,*.msixbundle -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $msix) { throw "MSIX package not found under Installer.Msix/bin/Release" }
          Copy-Item $msix.FullName (Join-Path $outDir $msix.Name) -Force
          if ($pfxPath -and (Test-Path $pfxPath)) { Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue }

      - name: Upload MSIX Artifact
        if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: KitchenInventory-Installer-MSIX
          path: artifacts/installer/*.msix*
          retention-days: 7

      - name: Export Diagnostics Bundle
        continue-on-error: true
        shell: pwsh
        run: |
          $destDir = "${{ github.workspace }}\artifacts\diagnostics"
          New-Item -ItemType Directory -Force -Path $destDir | Out-Null
          $zip = Join-Path $destDir "diagnostics-${{ github.run_id }}-${{ github.run_attempt }}.zip"
          $exe = "${{ github.workspace }}\src\KitchenInventory.Desktop\bin\Release\net8.0-windows\KitchenInventory.Desktop.exe"
          if (!(Test-Path $exe)) { throw "Desktop exe not found at $exe" }
          $proc = Start-Process -FilePath $exe -ArgumentList "--export-diagnostics=`"$zip`"" -PassThru -Wait -NoNewWindow
          $code = $proc.ExitCode
          Write-Host "Diagnostics export exit code: $code"
          if ($code -ne 0) { throw "Diagnostics export failed with exit code $code" }

      - name: Upload diagnostics artifact
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-bundle
          path: artifacts/diagnostics/*.zip
          retention-days: 7

      - name: Collect runtime logs
        if: always()
        shell: pwsh
        run: |
          $dest = "${{ github.workspace }}\artifacts\logs"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $src = "$env:LOCALAPPDATA\InventoryApp\logs"
          if (Test-Path $src) { Copy-Item -Path (Join-Path $src '*') -Destination $dest -Force -ErrorAction SilentlyContinue }

      - name: Collect crash dumps
        if: always()
        shell: pwsh
        run: |
          $dest = "${{ github.workspace }}\artifacts\dumps"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $roots = @("${{ github.workspace }}","$env:USERPROFILE","$env:LOCALAPPDATA","$env:TEMP","$env:TMP")
          foreach ($root in $roots) {
            if (Test-Path $root) {
              Get-ChildItem -Path $root -Recurse -Include *.dmp,*.mdmp -ErrorAction SilentlyContinue | ForEach-Object {
                $target = Join-Path $dest $_.Name
                Copy-Item -Path $_.FullName -Destination $target -Force -ErrorAction SilentlyContinue
              }
            }
          }

      - name: Upload logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: InventoryApp-logs
          path: artifacts/logs
          retention-days: 7

      - name: Upload crash dumps artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-dumps
          path: artifacts/dumps
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            tests/**/TestResults/*.trx
            **/TestResults/*.trx
          retention-days: 7

  crash-test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_DbgEnableMiniDump: "1"
      DOTNET_DbgMiniDumpType: "2"
      COMPlus_DbgEnableMiniDump: "1"
      COMPlus_DbgMiniDumpType: "2"
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      INVENTORY_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: ./global.json
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/*.csproj
            **/*.fsproj
            **/*.vbproj
            Directory.Packages.props

      - name: Restore
        run: |
          dotnet restore ./InventoryApp.sln -r win-x64

      - name: Build
        run: |
          dotnet build ./InventoryApp.sln --configuration Release --no-restore

      - name: Publish Desktop (portable)
        shell: pwsh
        run: |
          $dest = "${{ github.workspace }}\artifacts\publish\desktop"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          dotnet publish ./src/KitchenInventory.Desktop/KitchenInventory.Desktop.csproj `
            -c Release -r win-x64 -o $dest `
            -p:PublishSingleFile=false -p:IncludeNativeLibrariesForSelfExtract=false --no-restore

      - name: Trigger synthetic Sentry crash
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = "${{ github.workspace }}\src\KitchenInventory.Desktop\bin\Release\net8.0-windows\KitchenInventory.Desktop.exe"
          if (!(Test-Path $exe)) { throw "Desktop exe not found at $exe" }
          & $exe --crash-test=sentry
          Write-Host "Exit code: $LASTEXITCODE"

      - name: Trigger synthetic hard dump crash
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = "${{ github.workspace }}\src\KitchenInventory.Desktop\bin\Release\net8.0-windows\KitchenInventory.Desktop.exe"
          if (!(Test-Path $exe)) { throw "Desktop exe not found at $exe" }
          & $exe --crash-test=dump
          Write-Host "Exit code: $LASTEXITCODE"

      - name: Collect runtime logs
        if: always()
        shell: pwsh
        run: |
          $dest = "${{ github.workspace }}\artifacts\logs"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $src = "$env:LOCALAPPDATA\InventoryApp\logs"
          if (Test-Path $src) { Copy-Item -Path (Join-Path $src '*') -Destination $dest -Force -ErrorAction SilentlyContinue }

      - name: Collect crash dumps
        if: always()
        shell: pwsh
        run: |
          $dest = "${{ github.workspace }}\artifacts\dumps"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $roots = @("${{ github.workspace }}","$env:USERPROFILE","$env:LOCALAPPDATA","$env:TEMP","$env:TMP")
          foreach ($root in $roots) {
            if (Test-Path $root) {
              Get-ChildItem -Path $root -Recurse -Include *.dmp,*.mdmp -ErrorAction SilentlyContinue | ForEach-Object {
                $target = Join-Path $dest $_.Name
                Copy-Item -Path $_.FullName -Destination $target -Force -ErrorAction SilentlyContinue
              }
            }
          }

      - name: Upload logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-test-logs
          path: artifacts/logs
          retention-days: 7

      - name: Upload crash dumps artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-test-dumps
          path: artifacts/dumps
          retention-days: 7

  publish-winget:
    if: github.event_name == 'release' && secrets.WINGET_TOKEN != ''
    runs-on: windows-latest
    timeout-minutes: 20
    environment:
      name: release
    steps:
      - name: Publish to WinGet (MSI/MSIX)
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: ${{ vars.WINGET_IDENTIFIER }}
          token: ${{ secrets.WINGET_TOKEN }}
          max-versions-to-keep: 5
          installers-regex: '.(msi|msix|appx)(bundle){0,1}$'